<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>搜索</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="search-body">
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <div class="brand-name" id="siteName">小米素材站</div>
        <div class="brand-sub" id="siteSub"></div>
      </a>
      <nav class="main-nav" id="mainNav">
        <a class="nav-link" href="/">主页</a>
      </nav>
      <form class="search-form search-form-accent" id="searchForm" action="/search.html" method="get">
        <input type="search" name="keyword" id="searchInput" placeholder="搜索资源..." autocomplete="off" />
        <button type="submit">搜索</button>
      </form>
    </div>
  </header>

  <main class="section">
    <div class="wrap">
      <h1 class="search-heading" id="searchHeading">搜索</h1>
      <p class="search-count" id="searchCount">加载中...</p>
      <div class="search-grid" id="searchGrid"></div>
      <div class="search-empty" id="searchEmpty" hidden>
        <p>没有找到相关资源，试试其他关键词</p>
        <a class="btn btn-primary" href="/">返回首页</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap" id="siteFooter"></div>
  </footer>

  <script src="/js/common.js"></script>
  <script src="/js/search.js"></script>
</body>
</html>
