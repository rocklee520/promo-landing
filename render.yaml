services:
  - type: web
    name: promo-landing
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ADMIN_PASSWORD
        generateValue: false
        sync: false
