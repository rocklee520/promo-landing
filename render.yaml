services:
  - type: web
    name: promo-landing
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ADMIN_PASSWORD
        generateValue: false
        sync: false
      - key: GITHUB_REPO
        value: rocklee520/promo-landing
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_TOKEN
        generateValue: false
        sync: false
