<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小米素材站</title>
  <meta name="description" content="最新视频 / 图片预览与介绍" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="stylesheet" href="/css/styles.css?v=20260817a" />
  <link rel="preload" as="image" href="/assets/site/hero-bg.jpg" />
  <link rel="preconnect" href="/" />
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="/">
        <div class="brand-row">
          <div class="brand-name" id="siteName">小米素材站</div>
          <span class="brand-dot" aria-hidden="true"></span>
        </div>
        <div class="brand-sub" id="siteSub">最新视频 / 图片预览与介绍</div>
      </a>
      <nav class="main-nav" id="mainNav"></nav>
      <div class="top-actions">
        <a class="btn" href="/admin.html">管理后台</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero-banner">
      <img class="hero-banner-bg" src="/assets/site/hero-bg.jpg" alt="" decoding="async" fetchpriority="high" />
      <div class="hero-banner-mask" aria-hidden="true"></div>
      <div class="wrap hero-banner-inner">
        <h1 class="hero-title">
          <span id="heroSiteName">小米素材站</span>
          <span class="hero-title-sub" id="heroSiteSub">最新视频 / 图片预览与介绍</span>
        </h1>
        <form class="hero-search" id="searchForm" action="/search.html" method="get">
          <svg class="hero-search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="m21 21-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
          <input type="search" name="keyword" placeholder="搜索关键词，回车搜索..." autocomplete="off" />
          <button type="submit">搜索</button>
        </form>
        <div class="hot-keywords hot-keywords-hero" id="hotKeywords" aria-label="搜索热词"></div>
      </div>
    </section>

    <section class="section section-carousel">
      <div class="wrap">
        <div class="carousel" id="carousel">
          <div class="carousel-track" id="carouselTrack"></div>
          <div class="carousel-dots" id="carouselDots"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section-head">
          <h3>
            <svg class="section-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12.5 2.2c.4 2.2-.3 3.8-1.5 5.1-.9 1-1.3 1.8-1.2 2.8.1 1.3 1.1 2.3 2.3 2.3 1.5 0 2.6-1.2 2.6-2.8 0-.5-.1-1-.3-1.5 1.6 1.1 2.6 2.8 2.6 4.8 0 3.5-2.7 6.1-6.5 6.1S4 16.4 4 12.8c0-3.2 1.8-5.5 4.3-7.6.7-.6 1.4-1.3 1.9-2.1.4-.7.8-1.7 1.3-2.9z"/>
            </svg>
            热门排行
          </h3>
          <div class="tabs" id="rankTabs" hidden>
            <button class="tab active" data-rank="views">最多浏览</button>
          </div>
        </div>
        <div class="rank-list" id="rankList"></div>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="section-head">
          <h3 id="allTitle">全部内容</h3>
          <div class="tabs" id="sortTabs">
            <button class="tab active" data-sort="newest">最新</button>
            <button class="tab" data-sort="oldest">最旧</button>
            <button class="tab" data-sort="views">浏览最多</button>
          </div>
        </div>
        <div class="post-list" id="postList"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap site-footer-inner">
      <div class="footer-brand">
        <div class="footer-name" id="footerName">小米素材站</div>
        <div class="footer-sub" id="footerSub">素材预览</div>
      </div>
      <div id="siteFooter">内容由站长更新维护</div>
    </div>
  </footer>

  <script src="/js/common.js?v=20260817a" defer></script>
  <script src="/js/app.js?v=20260817a" defer></script>
</body>
</html>
