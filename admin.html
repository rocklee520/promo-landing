<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>管理后台 · 小米素材站</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260816a" />
</head>
<body class="admin-body">
  <div class="admin-shell">
    <div class="admin-card" id="loginCard">
      <h1>管理后台</h1>
      <p class="muted">请输入管理密码（可在登录后于站点设置里修改）</p>
      <div class="admin-grid">
        <label>
          密码
          <input id="passwordInput" type="password" placeholder="输入管理密码" />
        </label>
      </div>
      <div class="admin-actions">
        <button class="btn btn-primary" id="loginBtn">登录</button>
        <a class="btn" href="/">回前台</a>
      </div>
    </div>

    <div id="editor" hidden>
      <div class="admin-card">
        <h1>站点设置</h1>
        <div class="admin-grid">
          <div class="row-2">
            <label>站点名称<input id="cfgName" /></label>
            <label>副标题<input id="cfgSub" /></label>
          </div>
          <label>页脚文案<input id="cfgFooter" /></label>
          <label>管理密码（保存后生效）<input id="cfgPassword" type="text" /></label>
          <label>搜索热词（逗号分隔）<input id="cfgHotKeywords" placeholder="合集,自慰,福利姬,反差,女神,推特,白虎,萝莉" /></label>
          <label>标签词库（逗号分隔，用于后台参考）<input id="cfgTags" placeholder="合集,反差,网红,OnlyFans,视频,图片" /></label>
          <div class="row-2">
            <label>微信收款码图片 URL<input id="cfgWechatQr" placeholder="/assets/pay/wechat.jpg" /></label>
            <label>支付宝收款码图片 URL<input id="cfgAlipayQr" placeholder="/assets/pay/alipay.jpg" /></label>
          </div>
          <label>付款说明<input id="cfgPayNote" placeholder="付款时请在备注里填写订单号…" /></label>
          <label>PushPlus token（微信推送，留空不改）<input id="cfgPushPlus" type="password" autocomplete="off" placeholder="在 pushplus.plus 获取" /></label>
        </div>
        <div class="admin-actions">
          <button class="btn btn-primary" id="saveAllBtn">保存全部到服务器</button>
          <button class="btn" id="exportBtn">导出 JSON 备份</button>
          <label class="btn" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
            导入 JSON
            <input id="importInput" type="file" accept="application/json,.json" hidden />
          </label>
          <a class="btn" href="/" target="_blank">打开前台</a>
          <button class="btn" id="logoutBtn">退出登录</button>
        </div>
        <p class="muted" id="saveHint" style="margin-top:10px;"></p>
        <p class="muted" style="margin-top:6px;">备份：每次保存会自动下载 JSON，并约每 5 分钟同步到 GitHub。改完务必点「保存全部到服务器」。服务器会打时间戳；脚本若推送旧内容只会合并、不会整包盖掉你的后台修改。</p>
      </div>

      <div class="admin-card">
        <h2>新增 / 编辑内容</h2>
        <div class="admin-grid">
          <input id="editId" type="hidden" />
          <div class="row-2">
            <label>标题<input id="editTitle" placeholder="098.小野猫 kiki酱" /></label>
            <label>价格（显示在标题旁）<input id="editPrice" placeholder="30 或 30元" /></label>
          </div>
          <label>副标题（详情页大标题）<input id="editSubtitle" placeholder="合集标题…" /></label>
          <label>封面图链接（URL）<input id="editCover" placeholder="/assets/... 或 https://..." /></label>
          <label>介绍<textarea id="editSummary" placeholder="内容简介"></textarea></label>
          <label>下载说明<input id="editDownloadNote" placeholder="**本资源支持百度网盘 下载" /></label>
          <label>公开链接（免费内容用；付费请留空）<input id="editLink" placeholder="https://..." /></label>
          <label>发货链接（百度云，付费确认后才显示）<input id="editFulfillment" placeholder="https://pan.baidu.com/s/..." /></label>
          <label>图集（每行一个图片 URL）<textarea id="editGallery" placeholder="/assets/kiki/01.jpeg"></textarea></label>
          <label>搜索关键词 / 标签（逗号分隔）<input id="editTags" placeholder="合集,反差,网红,OnlyFans" /></label>
          <input id="editSeries" type="hidden" value="" />
          <div class="row-2">
            <label>日期<input id="editDate" type="date" /></label>
            <label>浏览数<input id="editViews" type="number" min="0" value="0" /></label>
          </div>
          <div class="row-2">
            <label>
              标记
              <select id="editFlags">
                <option value="none">普通</option>
                <option value="featured">仅轮播</option>
                <option value="hot">仅热门</option>
                <option value="both">轮播 + 热门</option>
              </select>
            </label>
            <label class="check-label">
              <span>下架（前台不显示）</span>
              <input id="editHidden" type="checkbox" />
            </label>
          </div>
        </div>
        <div class="admin-actions">
          <button class="btn btn-primary" id="upsertBtn">写入列表</button>
          <button class="btn" id="resetFormBtn">清空表单</button>
        </div>
      </div>

      <div class="admin-card">
        <h2>待处理订单</h2>
        <p class="muted">客户点「我已付款」后会出现在这里；也可在微信推送里一键确认。点「刷新订单」更新列表。</p>
        <div class="admin-actions" style="margin-bottom:10px;">
          <button class="btn" id="refreshOrdersBtn" type="button">刷新订单</button>
        </div>
        <div id="ordersList"></div>
      </div>

      <div class="admin-card">
        <h2>内容列表</h2>
        <div id="adminList"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/js/admin.js?v=20260816a"></script>
</body>
</html>
